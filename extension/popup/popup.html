<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LockIn</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="pop">
      <header class="head">
        <span class="lk-mark" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2.5" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
        </span>
        <span class="wordmark">LOCKIN</span>
        <span class="pill" id="pill">…</span>
      </header>

      <!-- One region, three faces: focusing, idle-with-work, idle-and-clear. -->
      <main id="main" aria-live="polite">
        <section id="focus-view" hidden>
          <p class="eyebrow">Focus</p>
          <p class="headline" id="focus-task">…</p>
          <p class="timer" id="focus-timer">—</p>
          <div class="lk-bar" id="bar-wrap" hidden><span id="bar" style="width: 0%"></span></div>
          <p class="sub" id="focus-sub"></p>
        </section>

        <section id="idle-view" hidden>
          <p class="headline" id="idle-headline">You’re on track.</p>
          <div class="next" id="next-row" hidden>
            <p class="eyebrow">Next</p>
            <p class="next-title" id="next-title"></p>
            <p class="sub" id="next-due"></p>
          </div>
          <p class="sub" id="idle-sub"></p>
        </section>
      </main>

      <button class="lk-btn lk-btn-primary full" id="primary">Open LockIn</button>
      <button class="linkish full" id="open-lockin" hidden>Open LockIn</button>

      <footer class="foot-row">
        <span class="conn" id="conn"></span>
        <button class="linkish" id="open-options">Settings</button>
      </footer>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
